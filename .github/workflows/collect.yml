# Runs the NTA GTFS-R collector on GitHub's servers, around the clock.
#
# GitHub's own scheduler turned out to be unreliable (runs started hours late
# or were skipped), so this workflow keeps itself going instead:
#
#   1. As soon as a run starts, it queues the NEXT run (workflow_dispatch).
#      The concurrency group holds that next run as "pending" until this one
#      finishes, so it starts straight afterwards (~1-2 min setup gap) and two
#      collectors never run at the same time.
#   2. It collects for 5 h 45 min (a job may run at most 6 h).
#   3. It uploads the data as an artifact named nta-data-<run id> (kept 90 days).
#
# If the chain ever breaks, watchdog.yml restarts it within the hour.
#
# Needs a repository secret called NTA_API_KEY.

name: Collect NTA GTFS-R data

on:
  workflow_dispatch:

concurrency:
  group: nta-collector
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # lets the run queue the next one

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect
        env:
          NTA_API_KEY: ${{ secrets.NTA_API_KEY }}
        run: python collector.py --duration 20700   # 5 h 45 min

      - name: Upload data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nta-data-${{ github.run_id }}
          path: |
            data/
            collector.log
          retention-days: 90
          compression-level: 0
          if-no-files-found: warn
